<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Reservas – Administración Campus Las Palmas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ══════════ VARIABLES ══════════ */
:root {
  --red:      #e02030;
  --red-glow: rgba(224,32,48,0.25);
  --blue:     #2255a4;
  --blue-dk:  #0f2550;
  --bg:       #0c1118;
  --s1:       #131923;
  --s2:       #1a2232;
  --s3:       #212d42;
  --border:   #263047;
  --text:     #dde3f0;
  --muted:    #7a8baa;
  --success:  #00c87a;
  --shadow:   0 8px 40px rgba(0,0,0,0.5);
}

/* ══════════ RESET / BASE ══════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 60% 40% at 10% 0%, rgba(224,32,48,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 90% 100%, rgba(34,85,164,0.09) 0%, transparent 70%);
}

/* ══════════ HEADER ══════════ */
header {
  background: linear-gradient(135deg, #0a1a3a 0%, #0f2550 100%);
  border-bottom: 2px solid var(--red);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 4px 30px rgba(0,0,0,0.6);
}

.logo-svg { width: 52px; height: 52px; flex-shrink: 0; }

.header-info { flex: 1; min-width: 0; }
.header-info h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(0.85rem, 2.5vw, 1.15rem);
  font-weight: 800;
  background: linear-gradient(90deg, #fff 50%, #99b8ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-info p {
  font-size: clamp(0.6rem, 1.5vw, 0.7rem);
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.badge-live {
  background: var(--red);
  color: #fff;
  font-size: 0.6rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: 1px;
  animation: blink 2s infinite;
  white-space: nowrap;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ══════════ FAB MÓVIL ══════════ */
.fab-toggle {
  display: none;
  position: fixed; bottom: 20px; right: 20px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--red), #900018);
  border: none; color: #fff;
  font-size: 1.5rem; cursor: pointer;
  box-shadow: 0 6px 24px var(--red-glow);
  z-index: 300;
  align-items: center; justify-content: center;
  transition: transform .2s;
}
.fab-toggle:hover { transform: scale(1.08); }

/* ══════════ LAYOUT PRINCIPAL ══════════ */
.app {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 16px;
  padding: 16px;
  max-width: 1440px;
  margin: 0 auto;
  align-items: start;
}

/* ══════════ SIDEBAR (formulario) ══════════ */
.sidebar {
  position: sticky; top: 76px;
  display: flex; flex-direction: column; gap: 12px;
}

/* ══════════ CARD ══════════ */
.card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.card-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.card-title::before {
  content: '';
  display: block;
  width: 3px; height: 14px;
  background: linear-gradient(180deg, var(--red), var(--blue));
  border-radius: 2px;
  flex-shrink: 0;
}

/* ══════════ FORM CONTROLS ══════════ */
.fg { margin-bottom: 9px; }
.fg label {
  display: block;
  font-size: 0.65rem; font-weight: 600;
  color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 4px;
}
.fg select, .fg input[type=text], .fg input[type=date],
.fg input[type=time], .fg input[type=file] {
  width: 100%;
  padding: 9px 11px;
  background: var(--s2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  -webkit-appearance: none;
}
.fg select:focus, .fg input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(34,85,164,0.2);
}
.fg input[type=file] { cursor: pointer; font-size: 0.78rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

/* ══════════ BUTTONS ══════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px;
  border: none; border-radius: 8px;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: transform .15s, filter .15s, box-shadow .15s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
.btn:active { transform: translateY(0); }

.btn-save {
  background: linear-gradient(135deg, var(--red) 0%, #8a000f 100%);
  color: #fff; width: 100%;
  padding: 12px; font-size: 0.85rem; margin-top: 4px;
  box-shadow: 0 4px 18px var(--red-glow);
}
.btn-xl { background: linear-gradient(135deg, #1a6b35, #0a3018); color: #fff; }
.btn-pdf { background: linear-gradient(135deg, var(--blue), var(--blue-dk)); color: #fff; }
.btn-ghost { background: var(--s2); color: var(--muted); border: 1px solid var(--border); }
.btn-struct { background: var(--s2); color: var(--text); border: 1px solid var(--border); font-size: 0.72rem; }
.btn-del {
  background: transparent; color: var(--red);
  border: 1px solid rgba(224,32,48,0.3);
  padding: 5px 8px; font-size: 0.68rem; border-radius: 6px;
}
.btn-del:hover { background: rgba(224,32,48,0.12); }

/* ══════════ STATS ══════════ */
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
.stat {
  background: var(--s2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; text-align: center;
}
.stat .n {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.5rem; font-weight: 900; color: var(--text);
  line-height: 1;
}
.stat .l { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }

/* ══════════ FILTROS ══════════ */
.filter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 9px;
  margin-bottom: 10px;
}
.filter-grid .fg { margin-bottom: 0; }
.filter-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }

/* ══════════ VISTA AGRUPADA POR FECHA ══════════ */
.day-group { margin-bottom: 18px; }
.day-header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: linear-gradient(90deg, var(--blue-dk), var(--s2));
  border-left: 3px solid var(--red);
  border-radius: 8px;
  margin-bottom: 8px;
}
.day-header .day-date {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.85rem; font-weight: 800;
  color: #fff;
}
.day-header .day-dow {
  font-size: 0.7rem; color: #ffcc66;
  background: rgba(255,200,80,0.12);
  border: 1px solid rgba(255,200,80,0.25);
  padding: 2px 8px; border-radius: 20px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
}
.day-header .day-count {
  margin-left: auto;
  font-size: 0.65rem; color: var(--muted);
  background: var(--s3); border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 20px;
}

/* ══════════ TABLA ══════════ */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 600px; }
thead tr { background: linear-gradient(90deg, #0e1f40, #1a2a4a); }
thead th {
  padding: 10px 11px;
  text-align: left;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.62rem; font-weight: 800;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: #8ab0ff; white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(34,85,164,0.07); }
tbody td { padding: 9px 11px; vertical-align: middle; }

.tag-hora {
  display: inline-flex; flex-direction: column; align-items: center;
  background: rgba(34,85,164,0.18);
  border: 1px solid rgba(34,85,164,0.4);
  color: #7eaaff; border-radius: 8px;
  padding: 4px 8px; font-size: 0.72rem; font-weight: 700;
  white-space: nowrap; line-height: 1.3;
}
.tag-hora .arrow { font-size: 0.6rem; color: var(--muted); }
.tag-fac {
  display: inline-block;
  background: rgba(224,32,48,0.1);
  border: 1px solid rgba(224,32,48,0.25);
  color: #ff7a85; padding: 2px 7px; border-radius: 20px;
  font-size: 0.65rem; font-weight: 700;
  margin-bottom: 3px;
}
.tag-car { font-size: 0.72rem; color: var(--muted); display: block; }

.empty-all {
  text-align: center; padding: 48px 20px;
  color: var(--muted); font-size: 0.85rem;
}
.empty-all .icon { font-size: 2.5rem; display: block; margin-bottom: 10px; opacity: .4; }

/* ══════════ CARDS MÓVIL (reemplaza tabla en pantallas pequeñas) ══════════ */
.mobile-cards { display: none; }
.res-card {
  background: var(--s2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  border-left: 3px solid var(--blue);
}
.res-card .rc-hora {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.85rem; font-weight: 800; color: #7eaaff; margin-bottom: 4px;
}
.res-card .rc-mat { font-size: 0.9rem; font-weight: 600; color: var(--text); }
.res-card .rc-meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.res-card .rc-fac {
  display: inline-block; font-size: 0.65rem; font-weight: 700;
  color: #ff7a85; background: rgba(224,32,48,0.1);
  border: 1px solid rgba(224,32,48,0.2); padding: 1px 6px; border-radius: 10px;
  margin-bottom: 4px;
}
.rc-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.rc-doc { font-size: 0.72rem; color: #7eaaff; }

/* ══════════ MODAL ESTRUCTURA ══════════ */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
  z-index: 500; align-items: center; justify-content: center;
  padding: 16px;
}
.overlay.open { display: flex; }
.modal {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 16px; padding: 24px;
  width: 100%; max-width: 480px;
  max-height: 85vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7);
}
.modal h3 {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.95rem; font-weight: 800; margin-bottom: 16px;
}
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.tab {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent; color: var(--muted);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.7rem; font-weight: 700; cursor: pointer;
  transition: all .2s;
}
.tab.on {
  background: linear-gradient(135deg, var(--blue), var(--blue-dk));
  border-color: var(--blue); color: #fff;
}
.tab-panel { display: none; }
.tab-panel.on { display: block; }
.add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 8px; }
.add-row input {
  padding: 9px 11px; background: var(--s2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none;
  width: 100%;
}
.add-row input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(34,85,164,0.2); }
.m-select {
  width: 100%; padding: 9px 11px; background: var(--s2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none;
  margin-bottom: 8px;
}
.item-list { margin-top: 6px; }
.item-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; background: var(--s2); border-radius: 8px;
  margin-bottom: 5px; font-size: 0.82rem;
}
.modal-footer { display: flex; justify-content: flex-end; margin-top: 18px; }

/* ══════════ SIDEBAR DRAWER MÓVIL ══════════ */
.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 250;
}
.sidebar-overlay.open { display: block; }

/* ══════════ RESPONSIVE ══════════ */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; padding: 10px; gap: 10px; }

  /* El sidebar se convierte en drawer */
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: min(360px, 92vw);
    background: var(--s1);
    border-right: 1px solid var(--border);
    z-index: 260;
    overflow-y: auto;
    padding: 16px;
    transform: translateX(-110%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    top: 0; /* cover full height */
  }
  .sidebar.drawer-open { transform: translateX(0); }
  .sidebar .sticky-inner { position: static; }

  .fab-toggle { display: flex; }
  .header-actions .btn-struct { display: none; }

  /* Oculta tabla de escritorio, muestra tarjetas */
  .table-wrap { display: none; }
  .mobile-cards { display: block; }
}

@media (max-width: 480px) {
  header { padding: 8px 12px; gap: 10px; }
  .logo-svg { width: 42px; height: 42px; }
  .stats { grid-template-columns: repeat(3,1fr); }
  .stat .n { font-size: 1.2rem; }
  .filter-grid { grid-template-columns: 1fr 1fr; }
  .filter-actions { gap: 6px; }
  .btn { font-size: 0.7rem; padding: 8px 12px; }
  .day-header { flex-wrap: wrap; gap: 6px; }
}
</style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header>
  <svg class="logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gr" x1="20" y1="170" x2="100" y2="25" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#c01030"/><stop offset="100%" stop-color="#e84040"/>
      </linearGradient>
      <linearGradient id="gb" x1="105" y1="70" x2="185" y2="175" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#3a80d0"/><stop offset="100%" stop-color="#1a4a90"/>
      </linearGradient>
    </defs>
    <!-- A izq roja -->
    <path d="M18 172 L82 28 L108 82 L66 172 Z" fill="url(#gr)"/>
    <!-- A der azul -->
    <path d="M103 72 L142 172 L184 172 L138 58 Z" fill="url(#gb)"/>
    <!-- Círculo con línea -->
    <circle cx="167" cy="50" r="11" stroke="#e03040" stroke-width="5.5" fill="none"/>
    <line x1="157" y1="58" x2="143" y2="72" stroke="#e03040" stroke-width="5" stroke-linecap="round"/>
    <!-- Engranaje -->
    <circle cx="92" cy="110" r="9.5" stroke="#e03040" stroke-width="3.5" fill="none"/>
    <circle cx="92" cy="110" r="3.5" fill="#e03040"/>
    <rect x="88.5" y="97" width="7" height="5.5" rx="1.5" fill="#e03040"/>
    <rect x="88.5" y="118" width="7" height="5.5" rx="1.5" fill="#e03040"/>
    <rect x="76" y="106.5" width="5.5" height="7" rx="1.5" fill="#e03040"/>
    <rect x="102" y="106.5" width="5.5" height="7" rx="1.5" fill="#e03040"/>
    <!-- Monitor -->
    <rect x="75" y="127" width="34" height="22" rx="3" stroke="#e03040" stroke-width="3.5" fill="none"/>
    <line x1="92" y1="149" x2="92" y2="156" stroke="#e03040" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="156" x2="100" y2="156" stroke="#e03040" stroke-width="3" stroke-linecap="round"/>
  </svg>

  <div class="header-info">
    <h1>Sistema de Reservas</h1>
    <p>Administración · Campus Las Palmas</p>
  </div>

  <div class="header-actions">
    <span class="badge-live">● EN LÍNEA</span>
    <button class="btn btn-struct" onclick="abrirModal()">⚙ Estructura</button>
  </div>
</header>

<!-- overlay sidebar móvil -->
<div class="sidebar-overlay" id="sideOverlay" onclick="cerrarDrawer()"></div>

<!-- FAB para abrir formulario en móvil -->
<button class="fab-toggle" id="fabBtn" onclick="abrirDrawer()" title="Nueva reserva">＋</button>

<!-- ══════════ APP ══════════ -->
<div class="app">

  <!-- ── SIDEBAR: FORMULARIO ── -->
  <aside class="sidebar" id="sidebar">
    <!-- Botón cerrar en móvil -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <span style="font-family:Montserrat;font-size:0.75rem;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase;">Nueva Reserva</span>
      <button class="btn btn-ghost" id="btnCerrarDrawer" onclick="cerrarDrawer()" style="padding:5px 10px;font-size:0.7rem;display:none;">✕ Cerrar</button>
    </div>

    <div class="card">
      <div class="fg">
        <label>Facultad</label>
        <select id="facultad" onchange="actualizarCarreras()"></select>
      </div>
      <div class="fg">
        <label>Carrera</label>
        <select id="carrera" onchange="actualizarMaterias()"></select>
      </div>
      <div class="fg">
        <label>Materia / Asignatura</label>
        <select id="materia"></select>
      </div>
      <div class="fg">
        <label>Docente</label>
        <input type="text" id="docente" placeholder="Nombre completo">
      </div>
      <div class="fg">
        <label>Ambiente / Aula</label>
        <input type="text" id="ambiente" placeholder="Ej: Aula 201, Lab. A">
      </div>
      <div class="fg">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div class="row2">
        <div class="fg">
          <label>Hora inicio</label>
          <input type="time" id="inicio">
        </div>
        <div class="fg">
          <label>Hora fin</label>
          <input type="time" id="fin">
        </div>
      </div>
      <div class="fg">
        <label>Documento (opcional)</label>
        <input type="file" id="documento">
      </div>
      <button class="btn btn-save" onclick="guardar()">✦ Guardar Reserva</button>
    </div>

    <!-- Botón estructura (solo en sidebar, visible en móvil) -->
    <button class="btn btn-ghost" style="width:100%;margin-top:10px;" onclick="abrirModal()">⚙ Gestionar Estructura Académica</button>
  </aside>

  <!-- ── CONTENIDO PRINCIPAL ── -->
  <main>
    <!-- Stats -->
    <div class="stats" style="margin-bottom:12px;">
      <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Reservas</div></div>
      <div class="stat"><div class="n" id="statHoy">0</div><div class="l">Hoy</div></div>
      <div class="stat"><div class="n" id="statAmbientes">0</div><div class="l">Ambientes</div></div>
    </div>

    <div class="card">
      <div class="card-title">Horario de Reservas por Fecha</div>

      <!-- Filtros -->
      <div class="filter-grid">
        <div class="fg">
          <label>Fecha</label>
          <input type="date" id="filtroFecha" onchange="mostrar()">
        </div>
        <div class="fg">
          <label>Facultad</label>
          <select id="filtroFacultad" onchange="mostrar()">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="fg" style="grid-column: 1 / -1;">
          <label>Buscar docente, materia o ambiente</label>
          <input type="text" id="busqueda" placeholder="Escribe para buscar…" oninput="mostrar()">
        </div>
      </div>

      <div class="filter-actions">
        <button class="btn btn-xl"  onclick="exportExcel()">📊 Excel</button>
        <button class="btn btn-pdf" onclick="exportPDF()">📄 PDF Horario</button>
        <button class="btn btn-ghost" onclick="limpiarFiltros()">✕ Limpiar</button>
      </div>

      <!-- Vista desktop: tabla agrupada por fecha -->
      <div id="vistaDesktop"></div>

      <!-- Vista móvil: cards agrupadas por fecha -->
      <div class="mobile-cards" id="vistaMobile"></div>
    </div>
  </main>
</div>

<!-- ══════════ JAVASCRIPT ══════════ -->
<script>
/* ─── ESTADO ─── */
let reservas   = JSON.parse(localStorage.getItem("rsv3")) || [];
let estructura = JSON.parse(localStorage.getItem("est3")) || {
  "Ingeniería": {
    "Sistemas Informáticos": ["Programación I","Programación II","Base de Datos","Redes","Sistemas Operativos","Ing. de Software"],
    "Civil":                 ["Mecánica de Suelos","Resistencia de Materiales","Topografía","Hidráulica"],
    "Eléctrica":             ["Circuitos Eléctricos","Electrónica Analógica","Automatización","Máquinas Eléctricas"]
  },
  "Ciencias Económicas": {
    "Administración de Empresas": ["Gestión Empresarial","Marketing","Finanzas Corporativas","Contabilidad General","Recursos Humanos"],
    "Economía":                   ["Microeconomía","Macroeconomía","Estadística Económica","Econometría"],
    "Contaduría Pública":         ["Contabilidad General","Auditoría","Tributación","Costos y Presupuestos"]
  },
  "Ciencias de la Salud": {
    "Medicina":   ["Anatomía","Fisiología","Farmacología","Patología","Semiología"],
    "Enfermería": ["Cuidados Básicos","Salud Comunitaria","Enfermería Clínica"],
    "Nutrición":  ["Nutrición Básica","Dietética","Bioquímica Nutricional"]
  },
  "Humanidades y Educación": {
    "Psicología":          ["Psicología General","Psicología Clínica","Neurociencia Cognitiva"],
    "Comunicación Social": ["Redacción Periodística","Comunicación Digital","Producción Audiovisual"],
    "Educación":           ["Didáctica General","Pedagogía","Psicopedagogía"]
  },
  "Derecho y Ciencias Políticas": {
    "Derecho":             ["Derecho Civil","Derecho Penal","Derecho Constitucional","Derecho Laboral"],
    "Ciencias Políticas":  ["Teoría Política","Relaciones Internacionales","Gobernanza"]
  }
};

const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

function saveEst() { localStorage.setItem("est3", JSON.stringify(estructura)); }
function saveRsv() { localStorage.setItem("rsv3", JSON.stringify(reservas)); }

/* ─── SELECTORES FORMULARIO ─── */
function initForm() {
  const el = document.getElementById("facultad");
  const sel = el.value;
  el.innerHTML = Object.keys(estructura).map(f=>`<option ${f===sel?'selected':''}>${f}</option>`).join('');
  actualizarCarreras();
  syncFiltroFac();
}
function actualizarCarreras() {
  const f = document.getElementById("facultad").value;
  const el = document.getElementById("carrera");
  el.innerHTML = (estructura[f] ? Object.keys(estructura[f]) : []).map(c=>`<option>${c}</option>`).join('');
  actualizarMaterias();
}
function actualizarMaterias() {
  const f = document.getElementById("facultad").value;
  const c = document.getElementById("carrera").value;
  document.getElementById("materia").innerHTML =
    (estructura[f]&&estructura[f][c] ? estructura[f][c] : []).map(m=>`<option>${m}</option>`).join('');
}
function syncFiltroFac() {
  const el = document.getElementById("filtroFacultad");
  const sel = el.value;
  el.innerHTML = `<option value="">Todas las facultades</option>` +
    Object.keys(estructura).map(f=>`<option ${f===sel?'selected':''}>${f}</option>`).join('');
}

/* ─── CONFLICTO ─── */
function hayConflicto(n, excl=-1) {
  return reservas.some((r,i) =>
    i!==excl && r.ambiente===n.ambiente && r.fecha===n.fecha &&
    n.inicio<r.fin && n.fin>n.inicio
  );
}

/* ─── GUARDAR ─── */
function guardar() {
  const docente  = document.getElementById("docente").value.trim();
  const ambiente = document.getElementById("ambiente").value.trim();
  const fecha    = document.getElementById("fecha").value;
  const inicio   = document.getElementById("inicio").value;
  const fin      = document.getElementById("fin").value;

  if (!docente||!ambiente||!fecha||!inicio||!fin) {
    Swal.fire({icon:"warning",title:"Campos incompletos",text:"Completa todos los campos obligatorios.",background:"#131923",color:"#dde3f0"});
    return;
  }
  if (inicio>=fin) {
    Swal.fire({icon:"error",title:"Horario inválido",text:"La hora de fin debe ser posterior al inicio.",background:"#131923",color:"#dde3f0"});
    return;
  }

  const file = document.getElementById("documento").files[0];
  const reader = new FileReader();
  reader.onload = () => {
    const nueva = {
      id: Date.now(),
      facultad: document.getElementById("facultad").value,
      carrera:  document.getElementById("carrera").value,
      materia:  document.getElementById("materia").value,
      docente, ambiente, fecha, inicio, fin,
      documento: file ? reader.result : null
    };
    if (hayConflicto(nueva)) {
      Swal.fire({icon:"error",title:"Conflicto de horario",text:`"${ambiente}" ya está reservado en ese horario.`,background:"#131923",color:"#dde3f0"});
      return;
    }
    reservas.push(nueva);
    saveRsv(); mostrar(); actualizarStats();
    ["docente","ambiente","fecha","inicio","fin"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("documento").value="";
    Swal.fire({icon:"success",title:"¡Reserva guardada!",timer:1600,showConfirmButton:false,background:"#131923",color:"#dde3f0"});
    cerrarDrawer();
  };
  if (file) reader.readAsDataURL(file); else reader.onload();
}

/* ─── ELIMINAR ─── */
function eliminar(id) {
  Swal.fire({
    icon:"warning", title:"¿Eliminar?", text:"Esta acción no se puede deshacer.",
    showCancelButton:true, confirmButtonText:"Sí, eliminar", cancelButtonText:"Cancelar",
    background:"#131923", color:"#dde3f0", confirmButtonColor:"#e02030"
  }).then(r => { if(r.isConfirmed){ reservas=reservas.filter(x=>x.id!==id); saveRsv(); mostrar(); actualizarStats(); }});
}

/* ─── HELPERS ─── */
function fmtFecha(f) {
  if (!f) return '—';
  const [y,m,d] = f.split('-');
  return `${d}/${m}/${y}`;
}
function fmtFechaLarga(f) {
  if (!f) return '—';
  const [y,m,d] = f.split('-');
  const dt = new Date(+y, +m-1, +d);
  return `${d} de ${dt.toLocaleString('es-ES',{month:'long'})} de ${y}`;
}
function diaSemana(f) {
  if (!f) return '';
  const [y,m,d] = f.split('-');
  return DIAS[new Date(+y,+m-1,+d).getDay()];
}

/* ─── FILTRAR Y ORDENAR ─── */
function getReservasFiltradas() {
  const f  = document.getElementById("filtroFecha").value;
  const ff = document.getElementById("filtroFacultad").value;
  const b  = document.getElementById("busqueda").value.toLowerCase();
  return reservas
    .filter(r =>
      (!f  || r.fecha===f) &&
      (!ff || r.facultad===ff) &&
      (!b  || [r.docente,r.materia,r.ambiente,r.carrera,r.facultad].some(x=>x.toLowerCase().includes(b)))
    )
    .sort((a,b) => {
      const fd = a.fecha.localeCompare(b.fecha);
      return fd !== 0 ? fd : a.inicio.localeCompare(b.inicio);
    });
}

/* ─── AGRUPAR POR FECHA ─── */
function agruparPorFecha(lista) {
  const g = {};
  lista.forEach(r => { if(!g[r.fecha]) g[r.fecha]=[]; g[r.fecha].push(r); });
  return g;
}

/* ─── MOSTRAR ─── */
function mostrar() {
  const datos = getReservasFiltradas();
  const grupos = agruparPorFecha(datos);
  const fechas = Object.keys(grupos).sort();

  // ── DESKTOP (tabla) ──
  let deskHtml = '';
  if (!fechas.length) {
    deskHtml = `<div class="table-wrap"><div class="empty-all"><span class="icon">📅</span>No hay reservas que coincidan con los filtros.</div></div>`;
  } else {
    fechas.forEach(fecha => {
      const rs = grupos[fecha];
      const filas = rs.map(r => `
        <tr>
          <td>
            <div class="tag-hora">
              <span>${r.inicio}</span>
              <span class="arrow">↓</span>
              <span>${r.fin}</span>
            </div>
          </td>
          <td>
            <span class="tag-fac">${r.facultad}</span>
            <span class="tag-car">${r.carrera}</span>
          </td>
          <td><strong>${r.materia}</strong></td>
          <td>${r.docente}</td>
          <td>${r.ambiente}</td>
          <td>${r.documento?`<a href="${r.documento}" target="_blank" style="color:#7eaaff;font-size:0.75rem;">Ver</a>`:'<span style="color:var(--muted)">—</span>'}</td>
          <td><button class="btn btn-del" onclick="eliminar(${r.id})">✕</button></td>
        </tr>`).join('');

      deskHtml += `
        <div class="day-group">
          <div class="day-header">
            <span class="day-date">📅 ${fmtFecha(fecha)}</span>
            <span class="day-dow">${diaSemana(fecha)}</span>
            <span class="day-count">${rs.length} reserva${rs.length!==1?'s':''}</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>Horario</th><th>Facultad / Carrera</th><th>Materia</th>
                <th>Docente</th><th>Ambiente</th><th>Doc</th><th>—</th>
              </tr></thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>`;
    });
  }
  document.getElementById("vistaDesktop").innerHTML = deskHtml;

  // ── MÓVIL (cards) ──
  let mobHtml = '';
  if (!fechas.length) {
    mobHtml = `<div class="empty-all"><span class="icon">📅</span>Sin resultados para los filtros actuales.</div>`;
  } else {
    fechas.forEach(fecha => {
      const rs = grupos[fecha];
      const cards = rs.map(r => `
        <div class="res-card">
          <div class="rc-fac">${r.facultad}</div>
          <div class="rc-hora">${r.inicio} – ${r.fin}</div>
          <div class="rc-mat">${r.materia}</div>
          <div class="rc-meta">👤 ${r.docente} &nbsp;·&nbsp; 🏫 ${r.ambiente}</div>
          <div class="rc-meta" style="margin-top:2px;font-size:0.7rem;color:var(--muted);">${r.carrera}</div>
          <div class="rc-actions">
            ${r.documento?`<a class="rc-doc" href="${r.documento}" target="_blank">📎 Ver documento</a>`:''}
            <button class="btn btn-del" onclick="eliminar(${r.id})" style="margin-left:auto;">✕ Eliminar</button>
          </div>
        </div>`).join('');

      mobHtml += `
        <div class="day-group">
          <div class="day-header">
            <span class="day-date">📅 ${fmtFecha(fecha)}</span>
            <span class="day-dow">${diaSemana(fecha)}</span>
            <span class="day-count">${rs.length} reserva${rs.length!==1?'s':''}</span>
          </div>
          ${cards}
        </div>`;
    });
  }
  document.getElementById("vistaMobile").innerHTML = mobHtml;
}

function limpiarFiltros() {
  ["filtroFecha","filtroFacultad","busqueda"].forEach(id => document.getElementById(id).value="");
  mostrar();
}

/* ─── STATS ─── */
function actualizarStats() {
  const hoy = new Date().toISOString().split('T')[0];
  document.getElementById("statTotal").textContent     = reservas.length;
  document.getElementById("statHoy").textContent       = reservas.filter(r=>r.fecha===hoy).length;
  document.getElementById("statAmbientes").textContent = new Set(reservas.map(r=>r.ambiente)).size;
}

/* ─── EXCEL ─── */
function exportExcel() {
  const datos = getReservasFiltradas().map(r=>({
    Fecha: fmtFecha(r.fecha), "Día": diaSemana(r.fecha),
    "Hora Inicio": r.inicio, "Hora Fin": r.fin,
    Facultad: r.facultad, Carrera: r.carrera,
    Materia: r.materia, Docente: r.docente, Ambiente: r.ambiente
  }));
  if (!datos.length) { Swal.fire({icon:"info",title:"Sin datos",background:"#131923",color:"#dde3f0"}); return; }
  const ws = XLSX.utils.json_to_sheet(datos);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Reservas");
  XLSX.writeFile(wb, `reservas_${new Date().toISOString().split('T')[0]}.xlsx`);
}

/* ─── PDF HORARIO ─── */
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const datos = getReservasFiltradas();
  if (!datos.length) {
    Swal.fire({icon:"info",title:"Sin datos para exportar",background:"#131923",color:"#dde3f0"}); return;
  }

  const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const grupos = agruparPorFecha(datos);
  const fechas = Object.keys(grupos).sort();

  const dibujarEncabezadoPagina = (fecha, pageTotal) => {
    // Fondo header
    doc.setFillColor(10, 25, 60);
    doc.rect(0, 0, W, 42, 'F');

    // Barra roja izquierda
    doc.setFillColor(224, 32, 48);
    doc.rect(0, 0, 4, 42, 'F');

    // Logo (formas geométricas)
    const lx=8, ly=5, sc=1.0;
    doc.setFillColor(224,32,48);
    // triángulo A izq
    doc.triangle(lx+2,ly+22*sc, lx+11,ly+2*sc, lx+15,ly+11*sc,'F');
    doc.triangle(lx+2,ly+22*sc, lx+8, ly+22*sc, lx+11,ly+11*sc,'F');
    // triángulo A der
    doc.setFillColor(34,85,164);
    doc.triangle(lx+12,ly+9*sc, lx+19,ly+22*sc, lx+23,ly+22*sc,'F');
    doc.triangle(lx+12,ly+9*sc, lx+15,ly+13*sc, lx+19,ly+22*sc,'F');
    // círculo
    doc.setDrawColor(224,32,48); doc.setLineWidth(0.9);
    doc.circle(lx+21,ly+3.5,2.2,'S');
    doc.line(lx+19.2,ly+5, lx+17.5,ly+6.8);

    // Engranaje pequeño
    doc.setFillColor(224,32,48);
    doc.circle(lx+11, ly+27, 2.5, 'S');

    // Textos encabezado
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(13.5);
    doc.text("SISTEMA DE RESERVAS DE AMBIENTES", 38, 13);

    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.setTextColor(160,195,255);
    doc.text("ADMINISTRACIÓN · CAMPUS LAS PALMAS", 38, 20);

    // ═══ FECHA DESTACADA ═══
    doc.setFillColor(224,32,48);
    doc.roundedRect(38, 24, W - 48, 13, 2, 2, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    const textoFecha = `📅  HORARIO DEL ${diaSemana(fecha).toUpperCase()}, ${fmtFechaLarga(fecha).toUpperCase()}`;
    doc.text(textoFecha, W/2, 32.5, {align:'center'});

    // Generado / página
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
    doc.setTextColor(120,150,200);
    const ahora = new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    doc.text(`Generado: ${ahora}`, W-6, 10, {align:'right'});
    if (pageTotal > 1) doc.text(`Página ${fechas.indexOf(fecha)+1} de ${pageTotal}`, W-6, 16, {align:'right'});
  };

  const dibujarPie = () => {
    const py = H - 6;
    doc.setDrawColor(50,70,110); doc.setLineWidth(0.3);
    doc.line(6, py-4, W-6, py-4);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
    doc.setTextColor(120,140,170);
    doc.text("Administración · Campus Las Palmas · Sistema de Reservas de Ambientes", 8, py);
    doc.text(`${new Date().getFullYear()}`, W-8, py, {align:'right'});
  };

  fechas.forEach((fecha, idx) => {
    if (idx > 0) doc.addPage();

    dibujarEncabezadoPagina(fecha, fechas.length);

    const rs = grupos[fecha];
    const filas = rs.map(r => [
      `${r.inicio}\n${r.fin}`,
      r.ambiente,
      r.facultad,
      r.carrera,
      r.materia,
      r.docente
    ]);

    doc.autoTable({
      head: [['Horario','Ambiente','Facultad','Carrera','Materia / Asignatura','Docente']],
      body: filas,
      startY: 46,
      theme: 'grid',
      styles: {
        font: 'helvetica', fontSize: 8,
        cellPadding: 4,
        textColor: [20,35,60],
        lineColor: [190,205,230],
        lineWidth: 0.25
      },
      headStyles: {
        fillColor: [20,50,110],
        textColor: [255,255,255],
        fontStyle: 'bold', fontSize: 7.5,
        halign: 'center'
      },
      alternateRowStyles: { fillColor: [237,242,255] },
      columnStyles: {
        0: { halign:'center', cellWidth:22, fontStyle:'bold', textColor:[20,60,160] },
        1: { halign:'center', cellWidth:38 },
        2: { cellWidth:42 },
        3: { cellWidth:38 },
        4: { cellWidth:55 },
        5: { cellWidth:55 }
      },
      margin: { left:6, right:6, bottom:14 },
      didDrawPage: () => dibujarPie()
    });
  });

  const ff = document.getElementById("filtroFacultad").value;
  const fd = document.getElementById("filtroFecha").value;
  const nombre = fd
    ? `horario_${fd}.pdf`
    : ff ? `horario_${ff.replace(/\s+/g,'_')}.pdf`
         : `horario_reservas_${new Date().toISOString().split('T')[0]}.pdf`;
  doc.save(nombre);
}

/* ─── DRAWER MÓVIL ─── */
function abrirDrawer() {
  const sidebar = document.getElementById("sidebar");
  sidebar.classList.add("drawer-open");
  document.getElementById("sideOverlay").classList.add("open");
  document.getElementById("btnCerrarDrawer").style.display = "flex";
  document.body.style.overflow = "hidden";
}
function cerrarDrawer() {
  document.getElementById("sidebar").classList.remove("drawer-open");
  document.getElementById("sideOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

/* ─── MODAL ESTRUCTURA ─── */
function abrirModal() {
  cerrarDrawer();
  document.getElementById("modalEstructura").classList.add("open");
  syncModalSelects();
  renderLstFac();
}
function cerrarModal() {
  document.getElementById("modalEstructura").classList.remove("open");
  initForm(); mostrar();
}
function switchTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  btn.classList.add('on');
  syncModalSelects();
}
function syncModalSelects() {
  const facs = Object.keys(estructura);
  ['selFacCar','selFacMat'].forEach(id => {
    const el = document.getElementById(id);
    const v = el.value;
    el.innerHTML = facs.map(f=>`<option ${f===v?'selected':''}>${f}</option>`).join('');
  });
  renderLstCar(); syncCarMat();
}

// Facultades
function renderLstFac() {
  document.getElementById("lstFac").innerHTML =
    Object.keys(estructura).map(f=>`
      <div class="item-row">
        <span>🏛 ${f}</span>
        <button class="btn btn-del" onclick="delFac('${f}')">✕</button>
      </div>`).join('') || '<p style="color:var(--muted);font-size:0.8rem;">Sin facultades registradas.</p>';
}
function addFacultad() {
  const v = document.getElementById("inFac").value.trim();
  if (!v) return;
  if (estructura[v]) { alert("Ya existe."); return; }
  estructura[v]={};
  saveEst(); document.getElementById("inFac").value="";
  renderLstFac(); syncModalSelects();
}
function delFac(f) {
  if (!confirm(`¿Eliminar "${f}" y todo su contenido?`)) return;
  delete estructura[f]; saveEst(); renderLstFac(); syncModalSelects();
}

// Carreras
function renderLstCar() {
  const f = document.getElementById("selFacCar").value;
  document.getElementById("lstCar").innerHTML =
    (f&&estructura[f] ? Object.keys(estructura[f]) : []).map(c=>`
      <div class="item-row">
        <span>📚 ${c}</span>
        <button class="btn btn-del" onclick="delCar('${f}','${c}')">✕</button>
      </div>`).join('') || '<p style="color:var(--muted);font-size:0.8rem;">Sin carreras.</p>';
}
function addCarrera() {
  const f=document.getElementById("selFacCar").value;
  const v=document.getElementById("inCar").value.trim();
  if(!f||!v) return;
  if(!estructura[f])estructura[f]={};
  if(estructura[f][v]){alert("Ya existe.");return;}
  estructura[f][v]=[];
  saveEst(); document.getElementById("inCar").value="";
  renderLstCar();
}
function delCar(f,c) {
  if(!confirm(`¿Eliminar carrera "${c}"?`))return;
  delete estructura[f][c]; saveEst(); renderLstCar();
}

// Materias
function syncCarMat() {
  const f=document.getElementById("selFacMat").value;
  const el=document.getElementById("selCarMat");
  el.innerHTML=(f&&estructura[f]?Object.keys(estructura[f]):[]).map(c=>`<option>${c}</option>`).join('');
  renderLstMat();
}
function renderLstMat() {
  const f=document.getElementById("selFacMat").value;
  const c=document.getElementById("selCarMat").value;
  document.getElementById("lstMat").innerHTML=
    (f&&c&&estructura[f]&&estructura[f][c]?estructura[f][c]:[]).map(m=>`
      <div class="item-row">
        <span>📖 ${m}</span>
        <button class="btn btn-del" onclick="delMat('${f}','${c}','${m}')">✕</button>
      </div>`).join('')||'<p style="color:var(--muted);font-size:0.8rem;">Sin materias.</p>';
}
function addMateria() {
  const f=document.getElementById("selFacMat").value;
  const c=document.getElementById("selCarMat").value;
  const v=document.getElementById("inMat").value.trim();
  if(!f||!c||!v)return;
  if(!estructura[f][c])estructura[f][c]=[];
  if(estructura[f][c].includes(v)){alert("Ya existe.");return;}
  estructura[f][c].push(v); saveEst();
  document.getElementById("inMat").value=""; renderLstMat();
}
function delMat(f,c,m) {
  if(!confirm(`¿Eliminar materia "${m}"?`))return;
  estructura[f][c]=estructura[f][c].filter(x=>x!==m); saveEst(); renderLstMat();
}

/* ─── INIT ─── */
initForm(); mostrar(); actualizarStats();
</script>
</body>
</html>
