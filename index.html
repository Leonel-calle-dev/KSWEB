<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Ambientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: Arial; background:#f4f6f9; margin:0; }
    .container { display:flex; gap:20px; padding:20px; }
    .form, .tabla { background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    .form { width:35%; }
    .tabla { width:65%; }
    input, select { width:100%; padding:8px; margin:5px 0; }
    button { padding:10px; width:100%; background:#007bff; color:white; border:none; border-radius:5px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ddd; padding:8px; text-align:center; }
    th { background:#007bff; color:white; }
  </style>
</head>
<body><div class="container">  <div class="form">
    <h3>Registrar Solicitud</h3><select id="facultad"></select>
<select id="carrera"></select>
<select id="materia"></select>

<input type="text" id="docente" placeholder="Docente">
<input type="text" id="ambiente" placeholder="Ambiente">
<input type="date" id="fecha">
<input type="time" id="inicio">
<input type="time" id="fin">

<label>Documento (PDF/Imagen)</label>
<input type="file" id="documento">

<button onclick="guardar()">Guardar</button>

  </div>  <div class="tabla">
    <h3>Reservas</h3>
    <table>
      <thead>
        <tr>
          <th>Hora</th>
          <th>Materia</th>
          <th>Carrera</th>
          <th>Ambiente</th>
          <th>Documento</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
  </div></div><script>

let reservas = [];

const estructura = {
  "Ingeniería": {
    "Sistemas": ["Programación", "Base de Datos"],
    "Civil": ["Estructuras"]
  }
};

const facultad = document.getElementById("facultad");
const carrera = document.getElementById("carrera");
const materia = document.getElementById("materia");

// cargar selects
for (let f in estructura) {
  facultad.innerHTML += `<option>${f}</option>`;
}

facultad.onchange = () => {
  carrera.innerHTML = "";
  for (let c in estructura[facultad.value]) {
    carrera.innerHTML += `<option>${c}</option>`;
  }
  carrera.onchange();
};

carrera.onchange = () => {
  materia.innerHTML = "";
  estructura[facultad.value][carrera.value].forEach(m => {
    materia.innerHTML += `<option>${m}</option>`;
  });
};

facultad.onchange();

function hayConflicto(nueva) {
  return reservas.some(r =>
    r.ambiente === nueva.ambiente &&
    r.fecha === nueva.fecha &&
    nueva.inicio < r.fin &&
    nueva.fin > r.inicio
  );
}

function guardar() {
  const file = document.getElementById("documento").files[0];
  let url = file ? URL.createObjectURL(file) : "";

  const nueva = {
    facultad: facultad.value,
    carrera: carrera.value,
    materia: materia.value,
    docente: document.getElementById("docente").value,
    ambiente: document.getElementById("ambiente").value,
    fecha: document.getElementById("fecha").value,
    inicio: document.getElementById("inicio").value,
    fin: document.getElementById("fin").value,
    documento: url
  };

  if (hayConflicto(nueva)) {
    Swal.fire("Error", "Horario ocupado", "error");
    return;
  }

  reservas.push(nueva);
  mostrar();
  Swal.fire("Éxito", "Reserva registrada", "success");
}

function mostrar() {
  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  reservas.forEach(r => {
    tabla.innerHTML += `
      <tr>
        <td>${r.inicio} - ${r.fin}</td>
        <td>${r.materia}</td>
        <td>${r.carrera}</td>
        <td>${r.ambiente}</td>
        <td>${r.documento ? `<a href="${r.documento}" target="_blank">Ver</a>` : "-"}</td>
      </tr>
    `;
  });
}

</script></body>
</html>
